<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>访问统计</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--fg:#1f2328;--dim:#6e7781;--border:#d0d7de;--accent:#0969da;--ok:#1a7f37;--err:#cf222e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--fg:#e6edf3;--dim:#8b949e;--border:#30363d;--accent:#388bfd;--ok:#3fb950;--err:#f85149}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12.5px}
td code{font:12px/1.5 ui-monospace,Consolas,monospace;word-break:break-all}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{color:var(--dim);font-size:12px}
.empty{color:var(--dim);padding:12px 0;text-align:center;font-size:13px}
.btn{appearance:none;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--fg);font-size:13.5px;padding:7px 16px;cursor:pointer}
.btn-danger{color:var(--err);border-color:var(--err)}
h2{font-size:14.5px;margin:0 0 10px}
.tabbar{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:5px 14px;border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:13px;background:var(--panel)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px}
.bar{height:5px;border-radius:3px;background:var(--accent);opacity:.45;min-width:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>访问统计</h1>
  <div class="sub">统计 /file/ 路径 GET 请求（状态 200）的次数</div>

  <div id="loginTip" class="card" style="display:none">
    <div style="font-weight:600;color:var(--err)">需要管理员权限</div>
    <div class="dim">请先在 <a href="/login" style="color:var(--accent)">/login</a> 登录管理员后刷新本页。</div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="total">-</b><span>累计访问</span></div>
        <div class="stat"><b id="fileCount">-</b><span>被访问文件数</span></div>
      </div>
      <div class="note">尽力而为统计：KV 并发写可能丢失少量计数；免费版 KV 每日写入约 1000 次上限，触顶后统计暂停（不影响文件访问）。仅记录路径与次数，不记录访问者身份。</div>
    </div>

    <div class="card">
      <div class="tabbar">
        <div class="tab on" id="tabTop">Top 文件</div>
        <div class="tab" id="tabRecent">最近访问</div>
      </div>
      <div id="topView"><div class="empty">加载中…</div></div>
      <div id="recentView" style="display:none"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <button id="reset" class="btn btn-danger">清空全部统计</button>
      <div class="note">只删除统计计数，不删除任何文件。</div>
    </div>
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtTime(ts){
    if (!ts) return '-';
    return new Date(ts * 1000).toLocaleString('zh-CN');
  }
  function fmtNum(n){ return Number(n || 0).toLocaleString('zh-CN'); }

  fetch('api/stats', { credentials: 'same-origin' }).then(function(r){
    if (r.status === 401) { $('loginTip').style.display = ''; return null; }
    return r.json();
  }).then(function(data){
    if (!data) return;
    $('panel').style.display = '';
    $('total').textContent = fmtNum(data.total);
    $('fileCount').textContent = fmtNum(data.fileCount);

    var files = data.files || [];
    var max = files.length ? files[0].n : 1;
    var top = $('topView');
    if (!files.length) {
      top.innerHTML = '<div class="empty">暂无访问记录</div>';
    } else {
      var rows = files.map(function(f, i){
        var w = max ? Math.max(2, Math.round(f.n / max * 100)) : 2;
        return '<tr><td class="num dim">' + (i + 1) + '</td><td><code>' + esc(f.path) + '</code><div class="bar" style="width:' + w + '%"></div></td>' +
          '<td class="num"><b>' + fmtNum(f.n) + '</b></td><td class="dim" style="white-space:nowrap">' + esc(fmtTime(f.last)) + '</td></tr>';
      }).join('');
      top.innerHTML = '<table><thead><tr><th style="width:36px">#</th><th>文件</th><th style="width:70px">次数</th><th style="width:150px">最近访问</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    var recent = data.recent || [];
    var rv = $('recentView');
    if (!recent.length) {
      rv.innerHTML = '<div class="empty">暂无访问记录</div>';
    } else {
      var rows2 = recent.map(function(r){
        return '<tr><td><code>' + esc(r.p) + '</code></td><td class="dim" style="white-space:nowrap">' + esc(fmtTime(r.t)) + '</td></tr>';
      }).join('');
      rv.innerHTML = '<table><thead><tr><th>文件</th><th style="width:170px">时间</th></tr></thead><tbody>' + rows2 + '</tbody></table>';
    }
  }).catch(function(){ $('loginTip').style.display = ''; });

  $('tabTop').addEventListener('click', function(){
    $('tabTop').classList.add('on'); $('tabRecent').classList.remove('on');
    $('topView').style.display = ''; $('recentView').style.display = 'none';
  });
  $('tabRecent').addEventListener('click', function(){
    $('tabRecent').classList.add('on'); $('tabTop').classList.remove('on');
    $('recentView').style.display = ''; $('topView').style.display = 'none';
  });

  $('reset').addEventListener('click', function(){
    if (!window.confirm('确定清空全部统计数据？此操作不可恢复（文件不受影响）。')) return;
    fetch('api/reset', { method: 'POST', credentials: 'same-origin' }).then(function(r){
      if (r.ok) location.reload();
      else if (r.status === 401) window.alert('需要管理员权限');
      else window.alert('清空失败');
    }).catch(function(){ window.alert('清空失败：网络错误'); });
  });
})();
</script>
</body>
</html>
