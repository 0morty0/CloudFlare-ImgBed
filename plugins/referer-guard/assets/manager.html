<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>防盗链设置</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--fg:#1f2328;--dim:#6e7781;--border:#d0d7de;--accent:#0969da;--ok:#1a7f37;--err:#cf222e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--fg:#e6edf3;--dim:#8b949e;--border:#30363d;--accent:#388bfd;--ok:#3fb950;--err:#f85149}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.row+.row{border-top:1px dashed var(--border)}
label{font-weight:600;font-size:13.5px}
.hint{color:var(--dim);font-size:12px;margin-top:2px}
textarea{width:100%;min-height:120px;margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:13px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
.btn{appearance:none;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--fg);font-size:13.5px;padding:7px 16px;cursor:pointer}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{color:var(--err);border-color:var(--err)}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
.msg.ok{display:block;color:var(--ok);border:1px solid var(--ok)}
.msg.err{display:block;color:var(--err);border:1px solid var(--err)}
.sw{position:relative;width:40px;height:22px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .15s;pointer-events:none}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{left:20px}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>防盗链设置</h1>
  <div class="sub">仅对 /file/ 的 GET/HEAD 生效；管理路径与本面板不受影响</div>

  <div id="loginTip" class="card" style="display:none">
    <div style="font-weight:600;color:var(--err)">需要管理员权限</div>
    <div class="hint">请先在 <a href="/login" style="color:var(--accent)">/login</a> 登录管理员后刷新本页。</div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div class="row">
        <div><label>启用防盗链拦截</label><div class="hint">关闭后所有请求直接放行</div></div>
        <span class="sw"><input type="checkbox" id="enabled"><i></i></span>
      </div>
      <div class="row">
        <div><label>允许无 Referer 访问</label><div class="hint">直接在地址栏打开、书签、新窗口等场景不带 Referer</div></div>
        <span class="sw"><input type="checkbox" id="allowEmpty"><i></i></span>
      </div>
    </div>

    <div class="card">
      <label for="whitelist">白名单域名（每行一个）</label>
      <div class="hint">填写主域名即自动覆盖全部子域，如 example.com 覆盖 blog.example.com</div>
      <textarea id="whitelist" placeholder="example.com&#10;blog.example.net"></textarea>
      <div class="note">未启用拦截时保存仅记录配置，不会拦截任何请求。非法行（含 / 或超长）会被自动过滤。</div>
    </div>

    <button id="save" class="btn btn-primary">保存配置</button>
    <div id="msg" class="msg"></div>
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function show(kind, text){ var m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }

  fetch('api/config', { credentials: 'same-origin' }).then(function(r){
    if (r.status === 401) { $('loginTip').style.display = ''; return null; }
    return r.json();
  }).then(function(data){
    if (!data || !data.config) return;
    var c = data.config;
    $('panel').style.display = '';
    $('enabled').checked = c.enabled === true;
    $('allowEmpty').checked = c.allowEmptyReferer !== false;
    $('whitelist').value = (c.whitelist || []).join('\n');
  }).catch(function(){ show('err', '加载配置失败，请刷新重试'); });

  $('save').addEventListener('click', function(){
    var lines = $('whitelist').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    var body = {
      enabled: $('enabled').checked,
      allowEmptyReferer: $('allowEmpty').checked,
      whitelist: lines,
    };
    fetch('api/save', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function(r){ return r.json().then(function(j){ return { status: r.status, json: j }; }); }).then(function(res){
      if (res.status === 401) { show('err', '保存失败：需要管理员权限'); return; }
      if (res.json && res.json.ok) {
        var saved = res.json.config.whitelist.length;
        show('ok', '已保存。当前白名单 ' + saved + ' 个域名' + (res.json.config.enabled ? '，拦截已启用' : '，拦截未启用'));
      } else {
        show('err', '保存失败：' + esc((res.json && res.json.error) || '未知错误'));
      }
    }).catch(function(){ show('err', '保存失败：网络错误'); });
  });
})();
</script>
</body>
</html>
