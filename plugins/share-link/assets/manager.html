<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>临时分享链接</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--fg:#1f2328;--dim:#6e7781;--border:#d0d7de;--accent:#0969da;--ok:#1a7f37;--err:#cf222e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--fg:#e6edf3;--dim:#8b949e;--border:#30363d;--accent:#388bfd;--ok:#3fb950;--err:#f85149}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
label{font-weight:600;font-size:13.5px;display:block;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:13.5px/1.4 inherit}
.field+.field){margin-top:12px}
.field{margin-top:12px}
.btn{appearance:none;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--fg);font-size:13.5px;padding:7px 16px;cursor:pointer}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm{padding:4px 10px;font-size:12.5px}
.btn-danger{color:var(--err);border-color:var(--err)}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
.msg.ok{display:block;color:var(--ok);border:1px solid var(--ok)}
.msg.err{display:block;color:var(--err);border:1px solid var(--err)}
.link-box{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.link-box code{flex:1;min-width:200px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font:12px/1.5 ui-monospace,Consolas,monospace;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12.5px}
td code{font:12px/1.5 ui-monospace,Consolas,monospace;word-break:break-all}
.dim{color:var(--dim);font-size:12px}
.empty{color:var(--dim);padding:12px 0;text-align:center;font-size:13px}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>临时分享链接</h1>
  <div class="sub">生成带过期时间的单文件临时链接，不暴露真实路径，可随时撤回</div>

  <div id="loginTip" class="card" style="display:none">
    <div style="font-weight:600;color:var(--err)">需要管理员权限</div>
    <div class="dim">请先在 <a href="/login" style="color:var(--accent)">/login</a> 登录管理员后刷新本页。生成 / 撤回链接需要管理员；<b>打开分享链接本身无需登录</b>。</div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <label for="path">文件路径</label>
      <input type="text" id="path" placeholder="/file/2026/report.pdf" spellcheck="false">
      <div class="field">
        <label for="hours">有效时长（小时）</label>
        <select id="hoursSel">
          <option value="1">1 小时</option>
          <option value="6">6 小时</option>
          <option value="24" selected>24 小时</option>
          <option value="72">3 天</option>
          <option value="168">7 天</option>
          <option value="720">30 天</option>
          <option value="custom">自定义…</option>
        </select>
      </div>
      <div class="field" id="hoursCustomRow" style="display:none">
        <input type="number" id="hoursCustom" min="0.5" max="720" step="0.5" value="12">
        <div class="dim" style="margin-top:4px">范围 0.5 – 720 小时</div>
      </div>
      <div class="field">
        <button id="create" class="btn btn-primary">生成链接</button>
      </div>
      <div id="result" style="display:none">
        <div class="link-box"><code id="resultUrl"></code><button id="copy" class="btn btn-sm">复制</button></div>
        <div class="dim" id="resultExp" style="margin-top:6px"></div>
      </div>
      <div id="msg" class="msg"></div>
      <div class="note">路径需以 /file/ 开头且不含 ..。受白名单/鉴权保护的文件：访问者自己登录站点后也可打开（链接会透传访问者的会话）。</div>
    </div>

    <div class="card">
      <label>已生效的分享链接</label>
      <div id="list"><div class="empty">加载中…</div></div>
    </div>
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtExp(ts){
    var d = new Date(ts * 1000);
    var diff = ts - Date.now() / 1000;
    var h = Math.floor(diff / 3600), m = Math.floor((diff % 3600) / 60);
    return d.toLocaleString('zh-CN') + '（剩 ' + (h >= 1 ? h + ' 小时' : m + ' 分钟') + '）';
  }
  function show(kind, text){ var m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }

  fetch('api/list', { credentials: 'same-origin' }).then(function(r){
    if (r.status === 401) { $('loginTip').style.display = ''; return null; }
    return r.json();
  }).then(function(data){
    if (!data) return;
    $('panel').style.display = '';
    renderList(data.links || []);
  }).catch(function(){ $('loginTip').style.display = ''; });

  function renderList(links){
    var box = $('list');
    if (!links.length) { box.innerHTML = '<div class="empty">暂无生效中的分享链接</div>'; return; }
    var rows = links.map(function(l){
      var url = location.origin + '/plugins/share-link/view/' + esc(l.token);
      return '<tr><td><code>' + esc(l.path) + '</code></td><td class="dim">' + esc(fmtExp(l.exp)) +
        '</td><td style="white-space:nowrap"><button class="btn btn-sm" data-copy="' + esc(url) + '">复制</button> ' +
        '<button class="btn btn-sm btn-danger" data-revoke="' + esc(l.token) + '">撤回</button></td></tr>';
    }).join('');
    box.innerHTML = '<table><thead><tr><th style="width:45%">文件</th><th>过期时间</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
    box.querySelectorAll('[data-copy]').forEach(function(b){
      b.addEventListener('click', function(){ copyText(b.getAttribute('data-copy')); });
    });
    box.querySelectorAll('[data-revoke]').forEach(function(b){
      b.addEventListener('click', function(){ revoke(b.getAttribute('data-revoke')); });
    });
  }

  function copyText(text){
    var done = function(ok){ if (ok) show('ok', '已复制到剪贴板'); else { window.prompt('请手动复制：', text); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
    } else { done(false); }
  }

  function revoke(token){
    if (!window.confirm('确定撤回该分享链接？撤回后立即失效。')) return;
    fetch('api/revoke', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token }),
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok) { show('ok', '已撤回'); refreshList(); }
      else show('err', '撤回失败');
    }).catch(function(){ show('err', '撤回失败：网络错误'); });
  }

  function refreshList(){
    fetch('api/list', { credentials: 'same-origin' }).then(function(r){ return r.json(); }).then(function(data){
      renderList((data && data.links) || []);
    }).catch(function(){});
  }

  $('hoursSel').addEventListener('change', function(){
    $('hoursCustomRow').style.display = this.value === 'custom' ? '' : 'none';
  });

  $('create').addEventListener('click', function(){
    var sel = $('hoursSel').value;
    var hours = sel === 'custom' ? parseFloat($('hoursCustom').value) : parseFloat(sel);
    var body = { path: $('path').value.trim(), hours: hours };
    fetch('api/create', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function(r){ return r.json().then(function(j){ return { status: r.status, json: j }; }); }).then(function(res){
      if (res.status === 401) { show('err', '生成失败：需要管理员权限'); return; }
      if (res.json && res.json.ok) {
        $('result').style.display = '';
        $('resultUrl').textContent = res.json.url;
        $('resultExp').textContent = '有效期至：' + new Date(res.json.exp * 1000).toLocaleString('zh-CN');
        show('ok', '生成成功');
        refreshList();
      } else {
        show('err', '生成失败：' + ((res.json && res.json.message) || res.json && res.json.error || '未知错误'));
      }
    }).catch(function(){ show('err', '生成失败：网络错误'); });
  });

  $('copy').addEventListener('click', function(){ copyText($('resultUrl').textContent); });
})();
</script>
</body>
</html>
